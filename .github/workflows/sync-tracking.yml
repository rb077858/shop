# Pulls tracking numbers from AliExpress every 6 hours and emails customers when their order ships.
# Needs repository secrets: SITE_URL (e.g. https://shop.reembir.com) and ADMIN_PASSWORD.
name: Sync AliExpress tracking
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$ADMIN_PASSWORD" ]; then echo "Secrets not set, skipping"; exit 0; fi
          curl -fsS -X POST "$SITE_URL/api/admin/sync-all" -H "authorization: Bearer $ADMIN_PASSWORD"
